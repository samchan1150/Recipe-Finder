<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Recipe Finder</h1>
        <input type="text" id="meal" placeholder="Enter a meal name">
        <button id="search">Search</button>
        <button id="lucky">I'm Feeling Lucky</button>

        <div class="filters">
            <label for="category">Category:</label>
            <select id="category"></select>

            <label for="area">Area:</label>
            <select id="area"></select>

            <label for="ingredient">Ingredient:</label>
            <select id="ingredient"></select>
        </div>

        <div id="results"></div>
    </div>

    <!-- Modal for displaying detailed recipe information -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle"></h2>
            <img id="modalImage" src="" alt="" style="width:100%">
            <h3>Ingredients:</h3>
            <ul id="modalIngredients"></ul>
            <h3>Instructions:</h3>
            <p id="modalInstructions"></p>
            <h3>Watch on YouTube:</h3>
            <a id="modalYouTubeLink" target="_blank">Watch Video</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
